<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบกำจัดแมลง CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Custom scrollbar */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

      /* Hide scrollbar utility */
      .scrollbar-hide::-webkit-scrollbar { display: none; }
      .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

      /* Smooth transitions */
      * { transition-property: color, background-color, border-color, box-shadow; transition-duration: 150ms; }
      button, a { transition-property: color, background-color, border-color, box-shadow, transform; }

      /* Font */
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans Thai', sans-serif; }

      /* Document printing: hide the app shell, print only the open document sheet */
      @media print {
        @page { size: A4; margin: 12mm; }
        body { background: #fff !important; }
        body.doc-open #root { display: none !important; }
        .no-print { display: none !important; }
        .doc-overlay {
          position: static !important;
          inset: auto !important;
          background: #fff !important;
          overflow: visible !important;
        }
        .doc-overlay > div { padding: 0 !important; }
        .doc-sheet {
          max-width: none !important;
          width: 100% !important;
          margin: 0 !important;
          padding: 0 !important;
          border: none !important;
          border-radius: 0 !important;
          box-shadow: none !important;
        }
        * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
      }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased">
    <div id="root"></div>
    <script type="module" src="/index.js"></script>
</body>
</html>
