name = "pest-crm"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# The built SPA is served from the same origin as /api, so the browser makes
# same-origin requests and needs no CORS in production.
[assets]
directory = "../frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "pest-crm"
database_id = "09817523-1a59-4c19-9748-eceb621b4ecf"
migrations_dir = "migrations"

[vars]
# Origins allowed to call the API cross-origin (local Vite dev server).
# Production is same-origin and does not rely on this.
ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173"

[observability]
enabled = true
