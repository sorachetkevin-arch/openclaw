<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CRM Lead Copilot — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #F1F5F9; -webkit-font-smoothing: antialiased; }
    input, button { font-family: inherit; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:none; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    .fade-up { animation: fadeUp 0.4s ease both; }
    .spinner { width:18px;height:18px;border:2px solid rgba(255,255,255,0.3);border-top-color:white;border-radius:50%;animation:spin 0.7s linear infinite;display:inline-block; }
  </style>
</head>
<body>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ── Demo accounts ──────────────────────────────────────────────────────────
const DEMO_ACCOUNTS = [
  { name:'Admin สมศักดิ์', email:'admin@crm.th',  password:'demo1234', role:'SUPER_ADMIN', initials:'SA', color:'linear-gradient(135deg,#F59E0B,#EF4444)' },
  { name:'John D.',        email:'john@crm.th',   password:'demo1234', role:'ADMIN',       initials:'JD', color:'linear-gradient(135deg,#6366F1,#8B5CF6)' },
  { name:'Sara K.',        email:'sara@crm.th',   password:'demo1234', role:'USER',        initials:'SK', color:'linear-gradient(135deg,#06B6D4,#10B981)' },
];

const GOOGLE_ACCOUNTS = [
  { name:'สมชาย ใจดี',   email:'somchai@gmail.com',   role:'ADMIN',       initials:'สช', color:'linear-gradient(135deg,#4285F4,#34A853)' },
  { name:'Natthawut K.', email:'natthawut@gmail.com', role:'USER',        initials:'NK', color:'linear-gradient(135deg,#EA4335,#FBBC05)' },
];

function GoogleIcon() {
  return (
    <svg width="18" height="18" viewBox="0 0 24 24">
      <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
      <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
      <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
      <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
    </svg>
  );
}

// ── Google OAuth Popup Simulator ──────────────────────────────────────────
function GooglePickerModal({ onSelect, onClose }) {
  return (
    <div style={{ position:'fixed',inset:0,background:'rgba(0,0,0,0.5)',zIndex:1000,display:'flex',alignItems:'center',justifyContent:'center',padding:20 }} onClick={onClose}>
      <div style={{ background:'#fff',borderRadius:16,width:380,boxShadow:'0 24px 64px rgba(0,0,0,0.18)' }} onClick={e=>e.stopPropagation()}>
        {/* Google header */}
        <div style={{ padding:'24px 24px 16px',textAlign:'center',borderBottom:'1px solid #F1F5F9' }}>
          <div style={{ display:'flex',justifyContent:'center',marginBottom:12 }}><GoogleIcon/></div>
          <div style={{ fontSize:16,fontWeight:700,color:'#202124' }}>Sign in with Google</div>
          <div style={{ fontSize:12,color:'#5F6368',marginTop:4 }}>Choose an account to continue to CRM Lead Copilot</div>
        </div>
        {/* Account list */}
        <div style={{ padding:'8px 0' }}>
          {GOOGLE_ACCOUNTS.map((acc,i) => (
            <div key={i} onClick={()=>onSelect(acc)} style={{ display:'flex',alignItems:'center',gap:12,padding:'12px 24px',cursor:'pointer',transition:'background 0.1s' }}
              onMouseEnter={e=>e.currentTarget.style.background='#F8FAFC'}
              onMouseLeave={e=>e.currentTarget.style.background='transparent'}
            >
              <div style={{ width:40,height:40,borderRadius:'50%',background:acc.color,display:'flex',alignItems:'center',justifyContent:'center',color:'white',fontWeight:700,fontSize:14,flexShrink:0 }}>
                {acc.initials}
              </div>
              <div>
                <div style={{ fontWeight:600,fontSize:14,color:'#202124' }}>{acc.name}</div>
                <div style={{ fontSize:12,color:'#5F6368' }}>{acc.email}</div>
              </div>
            </div>
          ))}
          {/* Use another account */}
          <div style={{ display:'flex',alignItems:'center',gap:12,padding:'12px 24px',cursor:'pointer',transition:'background 0.1s' }}
            onMouseEnter={e=>e.currentTarget.style.background='#F8FAFC'}
            onMouseLeave={e=>e.currentTarget.style.background='transparent'}
            onClick={()=>onSelect({ name:'Guest User', email:'guest@gmail.com', role:'USER', initials:'GU', color:'linear-gradient(135deg,#94A3B8,#64748B)' })}
          >
            <div style={{ width:40,height:40,borderRadius:'50%',background:'#F1F5F9',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0 }}>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="#64748B"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </div>
            <div style={{ fontSize:14,color:'#1A73E8',fontWeight:500 }}>Use another account</div>
          </div>
        </div>
        <div style={{ padding:'12px 24px',borderTop:'1px solid #F1F5F9',display:'flex',justifyContent:'space-between',fontSize:11,color:'#5F6368' }}>
          <a href="#" style={{ color:'#1A73E8',textDecoration:'none' }}>Privacy Policy</a>
          <a href="#" style={{ color:'#1A73E8',textDecoration:'none' }}>Terms of Service</a>
        </div>
      </div>
    </div>
  );
}

// ── Main Login Component ───────────────────────────────────────────────────
function LoginPage() {
  const [tab, setTab] = useState('login'); // 'login' | 'forgot'
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [showPw, setShowPw] = useState(false);
  const [remember, setRemember] = useState(true);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const [showGoogle, setShowGoogle] = useState(false);
  const [forgotSent, setForgotSent] = useState(false);
  const [success, setSuccess] = useState('');

  // Check if already logged in
  useEffect(() => {
    const auth = localStorage.getItem('crm_auth');
    if (auth) window.location.href = 'CRM Dashboard.html';
  }, []);

  const doLogin = (user) => {
    const authData = { name: user.name, email: user.email, role: user.role, initials: user.initials, color: user.color, loginTime: Date.now() };
    if (remember) localStorage.setItem('crm_auth', JSON.stringify(authData));
    else sessionStorage.setItem('crm_auth', JSON.stringify(authData));
    setSuccess(`Welcome back, ${user.name}!`);
    setTimeout(() => { window.location.href = 'CRM Dashboard.html'; }, 800);
  };

  const handleEmailLogin = () => {
    setError('');
    if (!email || !password) { setError('Please enter email and password'); return; }
    setLoading(true);
    setTimeout(() => {
      const user = DEMO_ACCOUNTS.find(a => a.email === email && a.password === password);
      if (user) { doLogin(user); }
      else { setLoading(false); setError('Invalid email or password. Try a demo account below.'); }
    }, 1200);
  };

  const handleGoogleSelect = (acc) => {
    setShowGoogle(false);
    setLoading(true);
    setTimeout(() => doLogin({ ...acc }), 1000);
  };

  const iStyle = {
    width:'100%', padding:'11px 14px', borderRadius:10, border:'1.5px solid #E2E8F0',
    fontSize:14, color:'#0F172A', background:'#fff', outline:'none',
    transition:'border-color 0.15s',
  };

  if (success) return (
    <div style={{ minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'#F1F5F9' }}>
      <div style={{ textAlign:'center' }}>
        <div style={{ width:64,height:64,borderRadius:'50%',background:'#ECFDF5',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 16px' }}>
          <svg width="28" height="28" viewBox="0 0 24 24" fill="#10B981"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
        </div>
        <div style={{ fontSize:18,fontWeight:700,color:'#0F172A',marginBottom:4 }}>{success}</div>
        <div style={{ fontSize:13,color:'#64748B' }}>Redirecting to dashboard…</div>
      </div>
    </div>
  );

  return (
    <div style={{ minHeight:'100vh', display:'flex' }}>
      {/* Left panel — branding */}
      <div style={{ flex:'0 0 480px', background:'linear-gradient(160deg,#1E1B4B 0%,#312E81 40%,#4F46E5 100%)', display:'flex', flexDirection:'column', justifyContent:'space-between', padding:'48px', position:'relative', overflow:'hidden' }}>
        {/* Background decoration */}
        <div style={{ position:'absolute',top:-80,right:-80,width:320,height:320,borderRadius:'50%',background:'rgba(255,255,255,0.04)' }}/>
        <div style={{ position:'absolute',bottom:-60,left:-40,width:240,height:240,borderRadius:'50%',background:'rgba(255,255,255,0.03)' }}/>
        {/* Logo */}
        <div style={{ display:'flex',alignItems:'center',gap:12,position:'relative' }}>
          <div style={{ width:44,height:44,borderRadius:12,background:'linear-gradient(135deg,#818CF8,#A78BFA)',display:'flex',alignItems:'center',justifyContent:'center' }}>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="white"><path d="M7 2v11h3v9l7-12h-4l4-8z"/></svg>
          </div>
          <div>
            <div style={{ color:'white',fontWeight:800,fontSize:18,lineHeight:1.1 }}>CRM Lead Copilot</div>
            <div style={{ color:'#A5B4FC',fontSize:11,marginTop:2 }}>Dashboard</div>
          </div>
        </div>
        {/* Hero text */}
        <div style={{ position:'relative' }}>
          <div style={{ fontSize:36,fontWeight:800,color:'white',lineHeight:1.2,marginBottom:16 }}>
            Supercharge your<br/>
            <span style={{ color:'#818CF8' }}>lead pipeline</span>
          </div>
          <div style={{ fontSize:14,color:'#A5B4FC',lineHeight:1.7,marginBottom:32 }}>
            จัดการ leads, วิเคราะห์ sales pipeline,<br/>
            และส่ง report ผ่าน LINE OA อัตโนมัติ
          </div>
          {/* Feature list */}
          {['Lead scoring — HOT / WARM / COLD', 'Pipeline Kanban with drag & drop', 'LINE OA automated reports', 'LIFF mobile dashboard'].map((f,i) => (
            <div key={i} style={{ display:'flex',alignItems:'center',gap:10,marginBottom:10 }}>
              <div style={{ width:20,height:20,borderRadius:'50%',background:'rgba(129,140,248,0.2)',border:'1px solid #818CF8',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0 }}>
                <svg width="10" height="10" viewBox="0 0 24 24" fill="#818CF8"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
              </div>
              <span style={{ fontSize:13,color:'#C7D2FE' }}>{f}</span>
            </div>
          ))}
        </div>
        <div style={{ fontSize:11,color:'#6366F1',position:'relative' }}>© 2026 CRM Lead Copilot · v1.0</div>
      </div>

      {/* Right panel — form */}
      <div style={{ flex:1, display:'flex', alignItems:'center', justifyContent:'center', padding:'48px 32px', background:'#F8FAFC', overflowY:'auto' }}>
        <div style={{ width:'100%', maxWidth:420 }} className="fade-up">

          {tab === 'login' && (
            <>
              <div style={{ marginBottom:32 }}>
                <h1 style={{ fontSize:26,fontWeight:800,color:'#0F172A',marginBottom:6 }}>Welcome back</h1>
                <p style={{ fontSize:14,color:'#64748B' }}>Sign in to your CRM dashboard</p>
              </div>

              {/* Google OAuth button */}
              <button onClick={()=>setShowGoogle(true)} style={{
                width:'100%', padding:'12px 16px', borderRadius:10,
                border:'1.5px solid #E2E8F0', background:'#fff',
                display:'flex', alignItems:'center', justifyContent:'center', gap:10,
                fontSize:14, fontWeight:600, color:'#374151', cursor:'pointer',
                marginBottom:20, boxShadow:'0 1px 3px rgba(0,0,0,0.06)',
                transition:'all 0.15s',
              }}
              onMouseEnter={e=>{e.currentTarget.style.borderColor='#6366F1';e.currentTarget.style.boxShadow='0 0 0 3px rgba(99,102,241,0.1)';}}
              onMouseLeave={e=>{e.currentTarget.style.borderColor='#E2E8F0';e.currentTarget.style.boxShadow='0 1px 3px rgba(0,0,0,0.06)';}}
              >
                <GoogleIcon/>
                Continue with Google
              </button>

              {/* Divider */}
              <div style={{ display:'flex',alignItems:'center',gap:12,marginBottom:20 }}>
                <div style={{ flex:1,height:1,background:'#E2E8F0' }}/>
                <span style={{ fontSize:12,color:'#94A3B8',fontWeight:500 }}>or sign in with email</span>
                <div style={{ flex:1,height:1,background:'#E2E8F0' }}/>
              </div>

              {/* Email/password form */}
              <div style={{ display:'flex',flexDirection:'column',gap:14 }}>
                <div>
                  <label style={{ fontSize:12,fontWeight:600,color:'#374151',marginBottom:6,display:'block' }}>Email address</label>
                  <input type="email" value={email} onChange={e=>setEmail(e.target.value)} style={iStyle} placeholder="you@company.com"
                    onFocus={e=>e.target.style.borderColor='#6366F1'} onBlur={e=>e.target.style.borderColor='#E2E8F0'}
                    onKeyDown={e=>e.key==='Enter'&&handleEmailLogin()}
                  />
                </div>
                <div>
                  <label style={{ fontSize:12,fontWeight:600,color:'#374151',marginBottom:6,display:'block' }}>Password</label>
                  <div style={{ position:'relative' }}>
                    <input type={showPw?'text':'password'} value={password} onChange={e=>setPassword(e.target.value)} style={{ ...iStyle,paddingRight:44 }} placeholder="••••••••"
                      onFocus={e=>e.target.style.borderColor='#6366F1'} onBlur={e=>e.target.style.borderColor='#E2E8F0'}
                      onKeyDown={e=>e.key==='Enter'&&handleEmailLogin()}
                    />
                    <button onClick={()=>setShowPw(v=>!v)} style={{ position:'absolute',right:12,top:'50%',transform:'translateY(-50%)',background:'none',border:'none',cursor:'pointer',color:'#94A3B8',padding:0 }}>
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d={showPw?'M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z':'M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z'}/></svg>
                    </button>
                  </div>
                </div>

                {/* Remember me + forgot */}
                <div style={{ display:'flex',justifyContent:'space-between',alignItems:'center' }}>
                  <label style={{ display:'flex',alignItems:'center',gap:8,cursor:'pointer',fontSize:13,color:'#374151' }}>
                    <div onClick={()=>setRemember(v=>!v)} style={{ width:18,height:18,borderRadius:5,border:`2px solid ${remember?'#6366F1':'#E2E8F0'}`,background:remember?'#6366F1':'#fff',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0 }}>
                      {remember && <svg width="10" height="10" viewBox="0 0 24 24" fill="white"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>}
                    </div>
                    Remember me
                  </label>
                  <button onClick={()=>setTab('forgot')} style={{ background:'none',border:'none',cursor:'pointer',fontSize:13,color:'#6366F1',fontWeight:600,padding:0 }}>Forgot password?</button>
                </div>

                {/* Error */}
                {error && (
                  <div style={{ background:'#FEF2F2',borderRadius:8,padding:'10px 12px',fontSize:12,color:'#991B1B',display:'flex',alignItems:'center',gap:8 }}>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="#EF4444"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
                    {error}
                  </div>
                )}

                {/* Sign in button */}
                <button onClick={handleEmailLogin} disabled={loading} style={{
                  width:'100%', padding:'13px', borderRadius:10, border:'none',
                  background: loading ? '#C7D2FE' : 'linear-gradient(135deg,#6366F1,#8B5CF6)',
                  color:'white', fontSize:14, fontWeight:700, cursor: loading?'not-allowed':'pointer',
                  display:'flex', alignItems:'center', justifyContent:'center', gap:8,
                  boxShadow: loading ? 'none' : '0 4px 12px rgba(99,102,241,0.4)',
                  transition:'all 0.2s',
                }}>
                  {loading ? <><span className="spinner"/> Signing in…</> : 'Sign In'}
                </button>
              </div>

              {/* Demo accounts */}
              <div style={{ marginTop:28,padding:16,background:'#F0F9FF',borderRadius:12,border:'1px solid #BAE6FD' }}>
                <div style={{ fontSize:11,fontWeight:700,color:'#0369A1',marginBottom:10,textTransform:'uppercase',letterSpacing:'0.05em' }}>Demo Accounts</div>
                <div style={{ display:'flex',flexDirection:'column',gap:6 }}>
                  {DEMO_ACCOUNTS.map((acc,i)=>(
                    <div key={i} onClick={()=>{ setEmail(acc.email); setPassword(acc.password); }} style={{ display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 10px',background:'#fff',borderRadius:8,cursor:'pointer',border:'1px solid #E0F2FE',transition:'all 0.1s' }}
                      onMouseEnter={e=>e.currentTarget.style.borderColor='#6366F1'}
                      onMouseLeave={e=>e.currentTarget.style.borderColor='#E0F2FE'}
                    >
                      <div style={{ display:'flex',alignItems:'center',gap:8 }}>
                        <div style={{ width:26,height:26,borderRadius:'50%',background:acc.color,display:'flex',alignItems:'center',justifyContent:'center',color:'white',fontWeight:700,fontSize:9,flexShrink:0 }}>{acc.initials}</div>
                        <div>
                          <div style={{ fontSize:11,fontWeight:600,color:'#0F172A' }}>{acc.name}</div>
                          <div style={{ fontSize:10,color:'#94A3B8' }}>{acc.email}</div>
                        </div>
                      </div>
                      <span style={{ fontSize:9,fontWeight:700,background: acc.role==='SUPER_ADMIN'?'#EEF2FF':acc.role==='ADMIN'?'#FFFBEB':'#F0FDF4',color: acc.role==='SUPER_ADMIN'?'#6366F1':acc.role==='ADMIN'?'#F59E0B':'#10B981',borderRadius:4,padding:'2px 6px' }}>{acc.role}</span>
                    </div>
                  ))}
                </div>
                <div style={{ fontSize:10,color:'#0369A1',marginTop:8,textAlign:'center' }}>Click any account to autofill · Password: demo1234</div>
              </div>
            </>
          )}

          {tab === 'forgot' && (
            <>
              <button onClick={()=>{setTab('login');setForgotSent(false);}} style={{ display:'flex',alignItems:'center',gap:6,background:'none',border:'none',cursor:'pointer',color:'#6366F1',fontWeight:600,fontSize:13,marginBottom:24,padding:0 }}>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                Back to login
              </button>
              {!forgotSent ? (
                <>
                  <h1 style={{ fontSize:24,fontWeight:800,color:'#0F172A',marginBottom:6 }}>Reset password</h1>
                  <p style={{ fontSize:14,color:'#64748B',marginBottom:28 }}>Enter your email to receive reset instructions</p>
                  <label style={{ fontSize:12,fontWeight:600,color:'#374151',marginBottom:6,display:'block' }}>Email address</label>
                  <input type="email" value={email} onChange={e=>setEmail(e.target.value)} style={{ ...iStyle,marginBottom:16 }} placeholder="you@company.com"
                    onFocus={e=>e.target.style.borderColor='#6366F1'} onBlur={e=>e.target.style.borderColor='#E2E8F0'}
                  />
                  <button onClick={()=>{ if(email) setForgotSent(true); }} style={{ width:'100%',padding:'13px',borderRadius:10,border:'none',background:'linear-gradient(135deg,#6366F1,#8B5CF6)',color:'white',fontSize:14,fontWeight:700,cursor:'pointer',boxShadow:'0 4px 12px rgba(99,102,241,0.4)' }}>
                    Send Reset Link
                  </button>
                </>
              ) : (
                <div style={{ textAlign:'center',paddingTop:20 }}>
                  <div style={{ width:64,height:64,borderRadius:'50%',background:'#EEF2FF',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 16px' }}>
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="#6366F1"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                  </div>
                  <h2 style={{ fontSize:18,fontWeight:700,color:'#0F172A',marginBottom:8 }}>Check your email</h2>
                  <p style={{ fontSize:13,color:'#64748B',marginBottom:20 }}>We sent a password reset link to<br/><strong>{email}</strong></p>
                  <button onClick={()=>{setTab('login');setForgotSent(false);}} style={{ background:'#6366F1',color:'white',border:'none',borderRadius:10,padding:'10px 24px',fontSize:13,fontWeight:600,cursor:'pointer' }}>Back to Login</button>
                </div>
              )}
            </>
          )}
        </div>
      </div>

      {showGoogle && <GooglePickerModal onSelect={handleGoogleSelect} onClose={()=>setShowGoogle(false)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<LoginPage/>);
</script>
